# VORLAGE für Zigbee2MQTT (v2.x) – wird beim ersten Start von "zigbee2mqtt-init"
# nach zigbee2mqtt/data/configuration.yaml kopiert (nur wenn dort noch keine existiert).
# Änderungen an dieser Vorlage wirken sich danach nicht mehr aus.
# serial.port, mqtt.server, mqtt.user und mqtt.password kommen aus compose.yaml / .env.
# Beim ersten Start ersetzt Z2M die "GENERATE"-Werte durch zufällige Schlüssel –
# data/configuration.yaml danach SICHERN (nicht committen!), sonst müssen alle Geräte neu angelernt werden.
version: 4

homeassistant:
  enabled: true

frontend:
  enabled: true
  port: 8124

mqtt:
  base_topic: zigbee2mqtt

serial:
  adapter: ember

advanced:
  log_level: info
  channel: 25          # 15, 20 oder 25 kollidieren am wenigsten mit WLAN
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
